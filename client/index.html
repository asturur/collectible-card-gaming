<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: lascia che la pagina disegni anche sotto il notch/la
         barra di stato (zona "safe area"), invece di lasciarla bianca come
         sfondo di sistema; il colore/gradiente in quella zona lo mette index.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Colore della barra di stato quando il browser non usa la pagina stessa
         per disegnarla (es. a pagina ferma, fuori dalla modalità "cover"). -->
    <meta name="theme-color" content="#0f172a" />
    <!-- App installabile ("Aggiungi a Home" da Safari su iPhone): si apre a
         schermo intero, con la sua icona. Niente service worker: nessuna
         cache offline, l'app si aggiorna a ogni apertura come il sito. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Registro MTG" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Icone mana (ms ms-w / ms-u / ...) usate dal registro partite -->
    <link href="https://cdn.jsdelivr.net/npm/mana-font@latest/css/mana.min.css" rel="stylesheet" type="text/css" />
    <title>Registro partite di Magic</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
